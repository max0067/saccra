{% extends "base.html" %}

{% block title %}Inscription - SACRA{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16">
    <div class="max-w-md mx-auto">

        <div class="card-mystical rounded-2xl p-8 shadow-xl fade-in">
            <h1 class="text-4xl font-bold text-purple-900 mb-2 text-center">Commence ton voyage ✨</h1>
            <p class="text-gray-600 text-center mb-8">3 interprétations gratuites t'attendent</p>

            <form method="POST" action="{{ url_for('auth.register') }}">

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Prénom</label>
                    <input
                        type="text"
                        name="first_name"
                        required
                        class="w-full px-4 py-3 rounded-lg border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400"
                        placeholder="Ton prénom"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Email</label>
                    <input
                        type="email"
                        name="email"
                        required
                        class="w-full px-4 py-3 rounded-lg border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400"
                        placeholder="ton@email.com"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Mot de passe</label>
                    <input
                        type="password"
                        name="password"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 rounded-lg border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400"
                        placeholder="••••••••"
                    >
                    <p class="text-sm text-gray-500 mt-1">Minimum 6 caractères</p>
                </div>

                <button
                    type="submit"
                    class="w-full py-3 btn-primary text-white rounded-lg font-medium text-lg shadow-lg"
                >
                    Créer mon compte
                </button>

            </form>

            <p class="text-center text-gray-600 mt-6">
                Déjà un compte ?
                <a href="{{ url_for('auth.login') }}" class="text-purple-700 font-medium hover:underline">
                    Se connecter
                </a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
