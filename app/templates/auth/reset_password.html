{% extends "base.html" %}

{% block title %}Nouveau mot de passe - SACRA{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16">
    <div class="max-w-md mx-auto">

        <div class="card-mystical rounded-2xl p-8 shadow-xl fade-in">
            <h1 class="text-4xl font-bold text-purple-900 mb-2 text-center">Nouveau mot de passe 🔑</h1>
            <p class="text-gray-600 text-center mb-8">Choisis un nouveau mot de passe sécurisé</p>

            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Nouveau mot de passe</label>
                    <input
                        type="password"
                        name="password"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 rounded-lg border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400"
                        placeholder="Au moins 6 caractères"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Confirmer le mot de passe</label>
                    <input
                        type="password"
                        name="password_confirm"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 rounded-lg border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400"
                        placeholder="Même mot de passe"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full py-3 btn-primary text-white rounded-lg font-medium text-lg shadow-lg"
                >
                    Changer mon mot de passe
                </button>

            </form>

        </div>

    </div>
</div>
{% endblock %}
