{% extends "base.html" %}

{% block title %}Connexion - SACRA{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16">
    <div class="max-w-md mx-auto">

        <div class="card-mystical rounded-2xl p-8 shadow-xl fade-in">
            <h1 class="text-4xl font-bold text-purple-900 mb-2 text-center">Bienvenue 🌙</h1>
            <p class="text-gray-600 text-center mb-8">Reconnecte-toi à ton espace sacré</p>

            <form method="POST" action="{{ url_for('auth.login') }}">

                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">Email</label>
                    <input
                        type="email"
                        name="email"
                        required
                        class="w-full px-4 py-3 rounded-lg border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400"
                        placeholder="ton@email.com"
                    >
                </div>

                <div class="mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-gray-700 font-medium">Mot de passe</label>
                        <a href="{{ url_for('auth.forgot_password') }}" class="text-sm text-purple-600 hover:underline">
                            Mot de passe oublié ?
                        </a>
                    </div>
                    <input
                        type="password"
                        name="password"
                        required
                        class="w-full px-4 py-3 rounded-lg border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400"
                        placeholder="••••••••"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full py-3 btn-primary text-white rounded-lg font-medium text-lg shadow-lg"
                >
                    Se connecter
                </button>

            </form>

            <p class="text-center text-gray-600 mt-6">
                Pas encore de compte ?
                <a href="{{ url_for('auth.register') }}" class="text-purple-700 font-medium hover:underline">
                    S'inscrire
                </a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
